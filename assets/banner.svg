<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 272" width="100%">
  <defs>
    <linearGradient id="bGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f7dfa0"/>
      <stop offset="50%" stop-color="#c89143"/>
      <stop offset="100%" stop-color="#784e19"/>
    </linearGradient>
    <radialGradient id="bGlow" cx="72%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1c110a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @media (prefers-color-scheme: light) {
      .bg-wood-outer { fill: #6e4726 !important; }
      .bg-wood-inner { fill: #fbf5e8 !important; stroke: #8a5a24 !important; }
      .plank-line    { stroke: #e3cfb0 !important; }
      .bg-pill-dark  { fill: #3b2210 !important; stroke: #8a5a24 !important; }
      .txt-meta      { fill: #7c2d12 !important; }
      .txt-hero      { fill: #4a2106 !important; stroke: #c89143 !important; stroke-width: 0.6 !important; }
      .txt-sub       { fill: #291407 !important; }
      .txt-pill      { fill: #ffe7bd !important; }
      .line-orn      { stroke: #9c6830 !important; }
      .glow-layer    { opacity: 0.35 !important; }
      .compass-bg    { fill: #2b180c !important; }
    }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulseCode { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    .svg-spin { transform-origin: center; transform-box: fill-box; animation: spinSlow 28s linear infinite; }
    .code-glow { animation: pulseCode 3s ease-in-out infinite; }
  </style>

  <!-- Moldura Externa e Fundo Adaptável (Escuro por padrão, Pergaminho Claro em Light Mode) -->
  <rect class="bg-wood-outer" x="2" y="2" width="676" height="268" rx="12" fill="#1c110a" stroke="url(#bGold)" stroke-width="3.5"/>
  <rect class="bg-wood-inner" x="9" y="9" width="662" height="254" rx="8" fill="#26160c" stroke="#8a5a24" stroke-width="1.5"/>

  <!-- Linhas sutis das tábuas / pautas -->
  <line class="plank-line" x1="10" y1="68" x2="670" y2="68" stroke="#140b05" stroke-width="2" opacity="0.7"/>
  <line class="plank-line" x1="10" y1="132" x2="670" y2="132" stroke="#140b05" stroke-width="2" opacity="0.7"/>
  <line class="plank-line" x1="10" y1="194" x2="670" y2="194" stroke="#140b05" stroke-width="2" opacity="0.7"/>

  <!-- Brilho quente atrás dos monitores -->
  <rect class="glow-layer" x="9" y="9" width="662" height="254" rx="8" fill="url(#bGlow)"/>

  <!-- Cantoneiras de Bronze (compactas nos cantos: arm length 20px, x<=26, y<=26) -->
  <path d="M6 26 L6 6 L26 6" fill="none" stroke="url(#bGold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M654 6 L674 6 L674 26" fill="none" stroke="url(#bGold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M6 246 L6 266 L26 266" fill="none" stroke="url(#bGold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M654 266 L674 266 L674 246" fill="none" stroke="url(#bGold)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- ILUSTRAÇÃO DO SETUP DUAL MONITOR (Isolada entre x=382 e x=604) -->
  <g transform="translate(394, 24) scale(0.90)">
    <!-- Prateleira Superior com Livros -->
    <rect x="14" y="18" width="168" height="6" rx="2" fill="#4a2811" stroke="#784e19" stroke-width="1"/>
    <rect x="22" y="2" width="10" height="16" rx="1" fill="#991b1b"/>
    <rect x="34" y="-1" width="12" height="19" rx="1" fill="#1d4ed8"/>
    <rect x="48" y="4" width="10" height="14" rx="1" fill="#15803d"/>

    <!-- Bancada Amadeirada -->
    <polygon points="-4,136 232,136 244,162 -16,162" fill="#4a2811" stroke="#c89143" stroke-width="1.5"/>
    <rect x="-16" y="162" width="260" height="6" rx="2" fill="#241206"/>

    <!-- Suporte Articulado Duplo -->
    <rect x="103" y="106" width="18" height="26" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <polygon points="80,136 144,136 132,128 92,128" fill="#334155" stroke="#64748b" stroke-width="1"/>

    <!-- Monitor Esquerdo (Código Java / Spring / Angular) -->
    <g transform="translate(8, 38) skewY(-2.5)">
      <rect x="0" y="0" width="96" height="66" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
      <rect x="4" y="4" width="14" height="58" fill="#1e293b"/>
      <g class="code-glow">
        <rect x="23" y="11" width="35" height="4" rx="2" fill="#f59e0b"/>
        <rect x="23" y="19" width="56" height="4" rx="2" fill="#38bdf8"/>
        <rect x="28" y="27" width="44" height="4" rx="2" fill="#4ade80"/>
        <rect x="28" y="35" width="52" height="4" rx="2" fill="#c084fc"/>
        <rect x="32" y="43" width="38" height="4" rx="2" fill="#f87171"/>
        <rect x="23" y="51" width="46" height="4" rx="2" fill="#38bdf8"/>
      </g>
    </g>

    <!-- Monitor Direito (Métricas Linux / SQL / Cloud) - Termina bem antes da bússola -->
    <g transform="translate(112, 36) skewY(2.5)">
      <rect x="0" y="0" width="94" height="64" rx="4" fill="#0f172a" stroke="#94a3b8" stroke-width="2"/>
      <rect x="4" y="4" width="86" height="8" fill="#1e293b"/>
      <circle cx="9" cy="8" r="1.8" fill="#ef4444"/>
      <circle cx="15" cy="8" r="1.8" fill="#eab308"/>
      <circle cx="21" cy="8" r="1.8" fill="#22c55e"/>
      <g class="code-glow">
        <rect x="10" y="17" width="45" height="4" rx="2" fill="#22c55e"/>
        <rect x="10" y="25" width="64" height="4" rx="2" fill="#eab308"/>
        <rect x="12" y="44" width="7" height="12" rx="1" fill="#22c55e"/>
        <rect x="23" y="39" width="7" height="17" rx="1" fill="#22c55e"/>
        <rect x="34" y="34" width="7" height="22" rx="1" fill="#f59e0b"/>
        <rect x="45" y="41" width="7" height="15" rx="1" fill="#38bdf8"/>
        <rect x="56" y="32" width="7" height="24" rx="1" fill="#22c55e"/>
      </g>
    </g>

    <!-- Teclado, Mouse e Caneca -->
    <polygon points="62,141 156,141 162,154 56,154" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <ellipse cx="176" cy="148" rx="6" ry="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="196" y="112" width="15" height="17" rx="2.5" fill="#9a3412" stroke="#f59e0b" stroke-width="1"/>
    <path d="M211 116 C216 116, 216 125, 211 125" fill="none" stroke="#9a3412" stroke-width="2"/>
    <path d="M201 108 Q203 102 201 98" fill="none" stroke="#f5d796" stroke-width="1.3" opacity="0.8"/>
    <path d="M206 108 Q208 102 206 98" fill="none" stroke="#f5d796" stroke-width="1.3" opacity="0.8"/>
  </g>

  <!-- BÚSSOLA / ROSA DOS VENTOS (Isolada no canto superior direito: x=606..656, y=22..72) -->
  <g transform="translate(631, 47)">
    <circle class="compass-bg" cx="0" cy="0" r="25" fill="#1c110a" stroke="url(#bGold)" stroke-width="2.5"/>
    <g class="svg-spin">
      <circle cx="0" cy="0" r="18.5" fill="none" stroke="#c89143" stroke-width="1.4" stroke-dasharray="4 3"/>
      <polygon points="0,-21 3.5,-5.5 0,-8 -3.5,-5.5" fill="#f5d796"/>
      <polygon points="0,21 3.5,5.5 0,8 -3.5,5.5" fill="#c89143"/>
      <polygon points="-21,0 -5.5,3.5 -8,0 -5.5,-3.5" fill="#c89143"/>
      <polygon points="21,0 5.5,3.5 8,0 5.5,-3.5" fill="#f5d796"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#f5d796"/>
  </g>

  <!-- TEXTOS PRINCIPAIS À ESQUERDA (Folga larga da cantoneira em x>=38 e da bancada em x<=365) -->
  <text class="txt-meta" x="38" y="42" fill="#e0a958" font-family="Consolas, Monaco, monospace" font-size="15.5" font-weight="bold" letter-spacing="1.2">
    ANTONIO MIKAEL • FSMIKAEL
  </text>

  <text class="txt-hero" x="36" y="96" fill="#f5d796" stroke="#140a04" stroke-width="1" font-family="Georgia, 'Times New Roman', serif" font-size="47" font-weight="bold" letter-spacing="1">
    Hello, World
  </text>

  <!-- Divisor Ornamental -->
  <line class="line-orn" x1="38" y1="116" x2="188" y2="116" stroke="#c89143" stroke-width="2"/>
  <polygon points="198,108 206,116 198,124 190,116" fill="#d97706"/>
  <line class="line-orn" x1="208" y1="116" x2="356" y2="116" stroke="#c89143" stroke-width="2"/>

  <!-- Subtítulo nítido no Mobile e Desktop -->
  <text class="txt-sub" x="38" y="146" fill="#f5ebd6" font-family="Georgia, 'Times New Roman', serif" font-size="18.5" font-weight="bold">
    Engenheiro de Software Full Stack
  </text>
  <text class="txt-meta" x="38" y="172" fill="#e0a958" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="bold">
    Back-End • Front-End • Mobile &amp; Infra Web
  </text>

  <!-- Barra Inferior de Especialidades -->
  <rect class="bg-pill-dark" x="26" y="200" width="628" height="46" rx="8" fill="#150c06" stroke="#c89143" stroke-width="1.8"/>
  <text class="txt-pill" x="340" y="229" text-anchor="middle" fill="#f5d796" font-family="Consolas, Monaco, monospace" font-size="15.5" font-weight="bold">
    &gt;_ Java • Spring Boot • Angular • React Native • SQL • Linux &amp; AWS
  </text>
</svg>
