<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 668" width="100%">
  <style>
    @media (prefers-color-scheme: light) {
      .bg-wood-outer { fill: #6e4726 !important; }
      .bg-wood-inner { fill: #ead9be !important; stroke: #8a5a24 !important; }
      .bg-parchment  { fill: #fbf5e8 !important; stroke: #9c6830 !important; }
      .bg-wood-card  { fill: #fbf5e8 !important; stroke: #9c6830 !important; }
      .txt-body      { fill: #241105 !important; }
      .txt-highlight { fill: #7c2d12 !important; }
      .txt-amber     { fill: #853a0e !important; }
      .slot-orange   { fill: #9a3412 !important; }
      .slot-red      { fill: #991b1b !important; }
      .slot-blue     { fill: #075985 !important; }
      .slot-green    { fill: #14532d !important; }
      .slot-gold     { fill: #78350f !important; }
      .corner-stroke { stroke: #9c6830 !important; }
    }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes spinReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    .svg-spin { transform-origin: center; transform-box: fill-box; animation: spinSlow 26s linear infinite; }
    .svg-spin-rev { transform-origin: center; transform-box: fill-box; animation: spinReverse 18s linear infinite; }
  </style>

  <!-- Moldura Externa Amadeirada -->
  <rect class="bg-wood-outer" x="2" y="2" width="676" height="664" rx="12" fill="#1b1009" stroke="#c89143" stroke-width="3"/>
  <rect class="bg-wood-inner" x="10" y="10" width="660" height="648" rx="9" fill="#22130a" stroke="#8a5a24" stroke-width="1.5"/>

  <!-- CAIXA SUPERIOR DE BIO (Folga ampla no mobile e isolamento total da capitular e do selo) -->
  <rect class="bg-parchment" x="24" y="22" width="632" height="184" rx="8" fill="#2b180d" stroke="#c89143" stroke-width="2"/>

  <!-- Cantoneiras internas compactas (afastadas da capitular e do texto) -->
  <path class="corner-stroke" d="M30 40 L30 28 L42 28" fill="none" stroke="#d99b43" stroke-width="2.5"/>
  <path class="corner-stroke" d="M30 188 L30 200 L42 200" fill="none" stroke="#d99b43" stroke-width="2.5"/>
  <path class="corner-stroke" d="M638 200 L650 200 L650 188" fill="none" stroke="#d99b43" stroke-width="2.5"/>

  <!-- Selo de Engrenagens de Bronze no Canto Superior Direito (x=587..641, y=25..92) -->
  <g transform="translate(614, 52)">
    <polygon points="-13,16 -13,40 0,32 13,40 13,16" fill="#7f1d1d" stroke="#450a0a" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="27" fill="#1c110a" stroke="#c89143" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="21.5" fill="none" stroke="#9c6d2e" stroke-width="1" stroke-dasharray="3 3"/>
    <g class="svg-spin">
      <circle cx="-4.5" cy="-3.5" r="9" fill="none" stroke="#e5a039" stroke-width="3.2" stroke-dasharray="3.8 2.8"/>
      <circle cx="-4.5" cy="-3.5" r="3.6" fill="#1c110a" stroke="#e5a039" stroke-width="1.4"/>
    </g>
    <g class="svg-spin-rev">
      <circle cx="8" cy="7" r="6" fill="none" stroke="#c89143" stroke-width="2.6" stroke-dasharray="2.8 2.2"/>
    </g>
  </g>

  <!-- Capitular "A" Medieval + 5 Linhas Grandes e Nítidas -->
  <text class="txt-amber" x="48" y="88" fill="#f59e0b" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="bold">
    A
  </text>
  <text class="txt-body" x="94" y="57" fill="#f5ebd6" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold">
    tuo no desenvolvimento Full Stack e engenharia
  </text>
  <text class="txt-body" x="94" y="84" fill="#f5ebd6" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold">
    de sistemas na LWSA (KingHost), unindo suporte a
  </text>
  <text class="txt-body" x="46" y="119" fill="#f5ebd6" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold">
    sites, sistemas e APIs web à arquitetura em Java, Spring Boot,
  </text>
  <text class="txt-body" x="46" y="146" fill="#f5ebd6" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold">
    Angular, TypeScript e React Native com bancos SQL, Linux,
  </text>
  <text class="txt-highlight" x="46" y="173" fill="#e5c07b" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold">
    Docker, alta disponibilidade e ambientes Cloud (AWS).
  </text>

  <!-- 5 SLOTS DE ATRIBUTOS RPG (Fontes ampliadas para leitura fácil no Mobile) -->

  <!-- SLOT 1: LARANJA - ATUAÇÃO ATUAL -->
  <g transform="translate(24, 218)">
    <rect class="bg-wood-card" x="0" y="0" width="632" height="78" rx="8" fill="#28170c" stroke="#9c6d2e" stroke-width="1.6"/>
    <rect x="0" y="0" width="9" height="78" rx="4" fill="#f59e0b"/>
    <text class="slot-orange" x="24" y="28" fill="#fbbf24" font-family="Consolas, Monaco, monospace" font-size="15.5" font-weight="bold">
      🏢 ATUAÇÃO ATUAL — LWSA (KINGHOST) • SÃO PAULO, SP
    </text>
    <text class="txt-body" x="24" y="57" fill="#f5ebd6" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold">
      Suporte a Sites, Sistemas e APIs Web • Servidores Linux, DNS e Cloud
    </text>
  </g>

  <!-- SLOT 2: VERMELHO - EXPERIÊNCIA ANTERIOR -->
  <g transform="translate(24, 306)">
    <rect class="bg-wood-card" x="0" y="0" width="632" height="78" rx="8" fill="#28170c" stroke="#9c6d2e" stroke-width="1.6"/>
    <rect x="0" y="0" width="9" height="78" rx="4" fill="#ef4444"/>
    <text class="slot-red" x="24" y="28" fill="#f87171" font-family="Consolas, Monaco, monospace" font-size="15.5" font-weight="bold">
      💼 EXPERIÊNCIA ANTERIOR — MAXXCON
    </text>
    <text class="txt-body" x="24" y="57" fill="#f5ebd6" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold">
      Analista de TI • Sustentação ERP Linx, Queries SQL e Operações N1/N2
    </text>
  </g>

  <!-- SLOT 3: AZUL - ENGENHARIA DE SOFTWARE -->
  <g transform="translate(24, 394)">
    <rect class="bg-wood-card" x="0" y="0" width="632" height="78" rx="8" fill="#28170c" stroke="#9c6d2e" stroke-width="1.6"/>
    <rect x="0" y="0" width="9" height="78" rx="4" fill="#38bdf8"/>
    <text class="slot-blue" x="24" y="28" fill="#38bdf8" font-family="Consolas, Monaco, monospace" font-size="15.5" font-weight="bold">
      ⚔️ ENGENHARIA FULL STACK, MOBILE &amp; ARQUITETURA
    </text>
    <text class="txt-body" x="24" y="57" fill="#f5ebd6" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold">
      APIs REST Java (Spring Boot), Angular &amp; TS, React Native (Expo 58)
    </text>
  </g>

  <!-- SLOT 4: VERDE - FORMAÇÃO ACADÊMICA -->
  <g transform="translate(24, 482)">
    <rect class="bg-wood-card" x="0" y="0" width="632" height="78" rx="8" fill="#28170c" stroke="#9c6d2e" stroke-width="1.6"/>
    <rect x="0" y="0" width="9" height="78" rx="4" fill="#22c55e"/>
    <text class="slot-green" x="24" y="28" fill="#4ade80" font-family="Consolas, Monaco, monospace" font-size="15.5" font-weight="bold">
      🎓 FORMAÇÃO ACADÊMICA — CENTRO UNIVERSITÁRIO SENAC
    </text>
    <text class="txt-body" x="24" y="57" fill="#f5ebd6" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold">
      CST Análise e Desenvolvimento de Sistemas (2024–2026) | Técnico ADM
    </text>
  </g>

  <!-- SLOT 5: OURO - CERTIFICAÇÕES OFICIAIS -->
  <g transform="translate(24, 570)">
    <rect class="bg-wood-card" x="0" y="0" width="632" height="78" rx="8" fill="#28170c" stroke="#9c6d2e" stroke-width="1.6"/>
    <rect x="0" y="0" width="9" height="78" rx="4" fill="#eab308"/>
    <text class="slot-gold" x="24" y="28" fill="#facc15" font-family="Consolas, Monaco, monospace" font-size="15.5" font-weight="bold">
      🏅 CERTIFICAÇÕES OFICIAIS &amp; ESPECIALIZAÇÕES
    </text>
    <text class="txt-body" x="24" y="57" fill="#f5ebd6" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="bold">
      AWS Cloud Practitioner, AWS Generative AI, FluêncIA &amp; Segurança TI
    </text>
  </g>
</svg>
